grpo:
  model_path: "/projects/insightx-lab/cn_grpo/models/Llama-3.1-8B-Instruct-sft"
  train_data_path: "../datasets/processed/cn_train.csv"
  val_data_path: "../datasets/processed/cn_val.csv"
  test_data_path: "../datasets/processed/cn_test.csv"
  output_dir: "/projects/insightx-lab/cn_grpo/models/Llama-3.1-8B-Instruct-sft-grpo"
  evaluator_path: "../evaluator.py"

generation:
  model_path: "/projects/insightx-lab/cn_grpo/models/Llama-3.1-8B-Instruct-sft-grpo/epoch_3"
  test_data_path: "../datasets/processed/cn_test.csv"
  output_dir: "results"

  max_new_tokens: 128
  temperature: 0.7
  top_p: 0.9
  batch_size: 8
  seed: 42

evaluation:
  evaluator_path: "../evaluator.py"
  cn_path: "results/cn-gen-20251119_1316.csv"
  output_dir: "results"

prompts:
  system: |-
    You are a calm, helpful assistant.
    Write a single-paragraph reply of 35-50 words that de-escalates, shows empathy, corrects clear factual errors if any,
    and stays non-toxic (no insults/slurs/sarcasm).
    Do not repeat the original wording or add safety disclaimers.
  user: |-
    Reply constructively to this message from an online discussion:
    {HATE_SPEECH}