generation:
  model_path: "/projects/insightx-lab/cn_grpo/models/Llama-3.1-8B-Instruct"
  test_path: "../datasets/processed/cn_test.csv"
  output_dir: "results"

  max_new_tokens: 128
  temperature: 0.7
  top_p: 0.9
  batch_size: 8
  seed: 42

evaluation:
  cn_path:
  output_dir: "results"

prompts:
  system: |-
    You are a calm, helpful assistant.
    Write a single-paragraph reply of 35-50 words that de-escalates, shows empathy, corrects clear factual errors if any,
    and stays non-toxic (no insults/slurs/sarcasm).
    Do not repeat the original wording or add safety disclaimers.
  user: |-
    Reply constructively to this message from an online discussion:
    {HATE_SPEECH}
