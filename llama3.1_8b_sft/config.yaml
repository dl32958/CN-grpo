sft:
  model_path: "/projects/insightx-lab/cn_grpo/models/Llama-3.1-8B-Instruct"
  train_data_path: "../datasets/processed/train.jsonl"
  val_data_path: "../datasets/processed/val.jsonl"
  test_data_path: "../datasets/processed/test.jsonl"
  output_dir: "/projects/insightx-lab/cn_grpo/models/Llama-3.1-8B-Instruct-sft"

prompts:
  system: |-
    You are a helpful, factual, and empathetic assistant.
    Given a problematic claim from an online discussion, write a short, respectful reply
    that reduces tension, corrects inaccuracies, and promotes inclusive norms.
    Do not repeat slurs (paraphrase if needed). No safety disclaimers or "as an AI" statements.
  user_template: |-
    Reply constructively to this message from an online discussion:
    {HATE_SPEECH}